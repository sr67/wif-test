name: Test GCP WIF
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  test-wif:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate with GCP via WIF
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          service_account: 'bentocloud-admin@bentoml-prod.iam.gserviceaccount.com'
          workload_identity_provider: 'projects/412313301790/locations/global/workloadIdentityPools/github/providers/my-repo'
      - name: Confirm result
        run: |
          TOKEN=$(gcloud auth print-access-token 2>/dev/null || echo "FAILED")
          echo "Token prefix: ${TOKEN:0:30}..."
      - name: Verify identity (read-only)
        run: |
          curl -sf -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            "https://cloudresourcemanager.googleapis.com/v1/projects/bentoml-prod" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Project:', d.get('name'), d.get('projectNumber'))"

